<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Kurukshetra Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Yatra+One&display=swap">
<style>
/* Layout: a single 920px column. Title screen is a full-width chariot scene with the intro text beneath, left aligned.
   Quiz and result screens are a paper card over a fixed battlefield silhouette (spears, banners, war elephants). */
:root {
  --bg: #E4D1A6;
  --paper: #F0E3C2;
  --paper-2: #EADBB5;
  --ink: #33220F;
  --ink-soft: #6B5230;
  --saffron: #C98A2B;
  --saffron-deep: #9A6314;
  --rust: #9C3F20;
  --rust-text: #9C3F20;
  --bronze: #7B5A2C;
  --line: #C9B07C;
  --seg: #D2BB8D;
  --good: #5E7A33;
  --good-text: #476322;
  --on-accent: #FFF6E0;
  --sil: #3B2712;
  --sil-far: #8A6A3A;
  --sky1: #EBD9AE;
  --sky2: #DBA95C;
  --sun: #C9772A;
  --display: 'Yatra One', 'Noto Sans Devanagari', 'Noto Serif Devanagari', Georgia, serif;
  --body: 'Spectral', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B130D;
    --paper: #2A1D13;
    --paper-2: #33241A;
    --ink: #F1E2BF;
    --ink-soft: #C2A878;
    --saffron: #D99A3E;
    --saffron-deep: #E5AE5A;
    --rust: #B84B2D;
    --rust-text: #E58466;
    --bronze: #B98F55;
    --line: #4D3925;
    --seg: #4A3824;
    --good: #7C9F4A;
    --good-text: #A3C970;
    --on-accent: #FFF6E0;
    --sil: #0E0905;
    --sil-far: #4A3520;
    --sky1: #2B1D12;
    --sky2: #7A4A1E;
    --sun: #E0A24A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B130D;
  --paper: #2A1D13;
  --paper-2: #33241A;
  --ink: #F1E2BF;
  --ink-soft: #C2A878;
  --saffron: #D99A3E;
  --saffron-deep: #E5AE5A;
  --rust: #B84B2D;
  --rust-text: #E58466;
  --bronze: #B98F55;
  --line: #4D3925;
  --seg: #4A3824;
  --good: #7C9F4A;
  --good-text: #A3C970;
  --on-accent: #FFF6E0;
  --sil: #0E0905;
  --sil-far: #4A3520;
  --sky1: #2B1D12;
  --sky2: #7A4A1E;
  --sun: #E0A24A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 1.0625rem;
  line-height: 1.55;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
#root { position: relative; z-index: 1; max-width: 920px; margin-inline: auto; }
[hidden] { display: none !important; }

/* battlefield behind the questions */
.bf {
  position: fixed; left: 0; right: 0; bottom: 0;
  height: min(44vh, 360px);
  z-index: 0; pointer-events: none;
}
.bf svg { display: block; width: 100%; height: 100%; }
#root[data-screen="title"] ~ .bf { display: none; }

/* buttons */
.btn {
  font: 600 1.05rem/1 var(--body);
  background: var(--rust);
  color: var(--on-accent);
  border: 0;
  border-radius: 6px;
  padding: 0.95rem 1.6rem;
  cursor: pointer;
  transition: background-color 0.15s;
}
.btn:hover { background: color-mix(in srgb, var(--rust) 85%, var(--ink)); }
button:focus-visible, summary:focus-visible, h2:focus-visible {
  outline: 3px solid var(--saffron-deep);
  outline-offset: 3px;
}
h2:focus { outline: none; }
h2:focus-visible { outline: 3px solid var(--saffron-deep); }

/* title screen */
.art {
  margin: 0;
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  background: var(--sky1);
}
.art svg { display: block; width: 100%; height: auto; }
.flag { transform-origin: 540px 167px; animation: sway 3.4s ease-in-out infinite alternate; }
@keyframes sway { from { transform: skewY(-3deg); } to { transform: skewY(3deg); } }
.intro { padding-block: 28px 8px; max-width: 38rem; }
.intro h1 {
  margin: 0;
  font: 400 clamp(2.5rem, 9vw, 4.1rem)/1.02 var(--display);
  letter-spacing: 0.005em;
  text-wrap: balance;
}
.intro .dev {
  display: block;
  margin-top: 0.45rem;
  font-size: 0.42em;
  line-height: 1.2;
  color: var(--bronze);
  letter-spacing: 0.02em;
}
.lede { margin: 1.3rem 0 1.6rem; font-size: 1.2rem; line-height: 1.5; color: var(--ink); }
.note { margin: 1rem 0 0; color: var(--ink-soft); font-size: 0.95rem; }

/* quiz screen */
.hud { margin-bottom: 14px; }
.segs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.segs li { height: 8px; border-radius: 2px; background: var(--seg); }
.segs li.now { background: var(--saffron); }
.segs li.correct { background: var(--good); }
.segs li.wrong { background: var(--rust); }
.segs li.neutral { background: var(--bronze); }
.hud-row {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  margin-top: 10px; color: var(--ink-soft); font-size: 0.98rem;
}
.hud-row strong { color: var(--ink); font: 400 1.35rem/1 var(--display); font-variant-numeric: tabular-nums; }

.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: clamp(18px, 4vw, 34px);
}
#qtext {
  margin: 0 0 1.4rem;
  font: 600 clamp(1.3rem, 3.6vw, 1.65rem)/1.35 var(--body);
  text-wrap: balance;
  max-width: 40rem;
}
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 2rem minmax(0, 1fr) 1.4rem; align-items: center; gap: 0.85rem;
  width: 100%;
  text-align: left;
  font: 500 1.05rem/1.35 var(--body);
  color: var(--ink);
  background: var(--paper-2);
  border: 1.5px solid var(--line);
  border-radius: 6px;
  padding: 0.8rem 1rem;
  cursor: pointer;
  transition: border-color 0.15s, background-color 0.15s;
}
.opt:hover:not([aria-disabled="true"]) { border-color: var(--saffron); background: var(--paper); }
.opt[aria-disabled="true"] { cursor: default; }
.opt .key {
  display: grid; place-items: center;
  width: 2rem; height: 2rem; border-radius: 50%;
  border: 1.5px solid var(--bronze);
  color: var(--bronze);
  font: 600 0.95rem/1 var(--body);
}
.opt .mark { font-weight: 700; text-align: center; }
.opt.dim { opacity: 0.75; }
.opt.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 16%, var(--paper)); }
.opt.correct .key { background: var(--good); border-color: var(--good); color: var(--on-accent); }
.opt.correct .mark { color: var(--good-text); }
.opt.correct .mark::before { content: "\2713"; }
.opt.wrong { border-color: var(--rust); background: color-mix(in srgb, var(--rust) 14%, var(--paper)); }
.opt.wrong .key { background: var(--rust); border-color: var(--rust); color: var(--on-accent); }
.opt.wrong .mark { color: var(--rust-text); }
.opt.wrong .mark::before { content: "\2715"; }
.opt.picked { border-color: var(--bronze); background: var(--paper); }
.opt.picked .key { background: var(--bronze); color: var(--paper); }

.fb { margin-top: 1.3rem; padding: 1rem 1.1rem; background: var(--paper-2); border-radius: 6px; }
.fb:empty { display: none; }
.fb p { margin: 0; max-width: 40rem; }
.fb .status { font: 400 1.25rem/1.2 var(--display); margin-bottom: 0.4rem; }
.fb .status.correct { color: var(--good-text); }
.fb .status.wrong { color: var(--rust-text); }
.fb .status.neutral { color: var(--ink-soft); }
.fb .ref { margin-top: 0.55rem; font-style: italic; color: var(--ink-soft); font-size: 0.97rem; }
.actions { display: flex; justify-content: flex-end; margin-top: 1.2rem; }
.actions:empty, .actions:has(> [hidden]:only-child) { display: none; }

/* result screen */
.result { display: flex; flex-wrap: wrap; gap: 28px 40px; align-items: center; }
.ring-wrap { flex: 0 0 auto; width: 170px; max-width: 100%; }
.ring { display: block; width: 100%; height: auto; }
.ring .track { fill: none; stroke: var(--seg); stroke-width: 12; }
.ring .arc { fill: none; stroke: var(--saffron); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(0.2, 0.7, 0.2, 1); }
.ring .big { font: 400 54px/1 var(--display); fill: var(--ink); }
.ring .of { font: 500 14px/1 var(--body); fill: var(--ink-soft); }
.verdict { flex: 1 1 18rem; min-width: 0; }
.verdict h2 { margin: 0 0 0.5rem; font: 400 clamp(1.9rem, 6vw, 2.6rem)/1.1 var(--display); }
.verdict p { margin: 0 0 0.8rem; max-width: 34rem; }
.verdict .small { font-size: 0.95rem; color: var(--ink-soft); }
.verdict .segs { margin: 1.1rem 0 0.4rem; max-width: 26rem; }
.review { margin-top: 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 14px clamp(18px, 4vw, 34px); }
.review summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.review ol { margin: 14px 0 6px; padding-left: 1.4rem; display: grid; gap: 14px; }
.review li { padding-left: 0.3rem; }
.review .rq { margin: 0 0 0.2rem; font-weight: 600; }
.review .ra { margin: 0; font-size: 0.97rem; color: var(--ink-soft); }
.review .ra .ok { color: var(--good-text); font-weight: 600; }
.review .ra .no { color: var(--rust-text); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  .flag { animation: none; }
  .ring .arc, .opt, .btn { transition: none; }
}
</style>

    { q: "What does Lord Krishna teach about happiness and sorrow?",
      o: ["Happiness should be pursued at any cost", "Sorrow lasts forever", "Both should be faced with balance and equanimity", "A wise person never experiences sorrow"], a: 2, ref: "Bhagavad Gita 2.14",
      e: "Krishna explains that happiness and distress are temporary, and teaches Arjuna to tolerate them without being disturbed." },
    { q: "According to the Bhagavad Gita, which of these is considered the greatest obstacle to wisdom?",
      o: ["Self-control", "Compassion", "Uncontrolled desire", "Patience"], a: 2, ref: "Bhagavad Gita 3.39",
      e: "Krishna explains that uncontrolled desire covers knowledge and acts as an eternal enemy of the living being." }
  ];
  var LETTERS = "abcd";
  var SCORED = Q.filter(function (q) { return !q.unscored; }).length;
  var state = { i: 0, score: 0, answers: [], locked: false };

  function $(id) { return document.getElementById(id); }

  /* ---------- battlefield silhouettes ---------- */
  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function spears(W, base, o) {
    var r = rng(o.seed), x = -10, out = "";
    while (x < W + 10) {
      var h = o.min + r() * (o.max - o.min);
      var lean = (r() - 0.5) * 14;
      var tx = x + lean, ty = base - h;
      out += '<line x1="' + x + '" y1="' + base + '" x2="' + tx.toFixed(1) + '" y2="' + ty.toFixed(1) + '" stroke-width="' + o.sw + '"/>';
      out += '<path stroke="none" d="M' + (tx - 3).toFixed(1) + ' ' + (ty + 2).toFixed(1) + ' L' + tx.toFixed(1) + ' ' + (ty - 12).toFixed(1) + ' L' + (tx + 3).toFixed(1) + ' ' + (ty + 2).toFixed(1) + 'Z"/>';
      if (r() < 0.4) {
        out += '<path stroke="none" d="M' + tx.toFixed(1) + ' ' + (ty + 4).toFixed(1) + ' l' + o.flag + ' 5 l-' + o.flag + ' 8 Z"/>';
      }
      x += o.gap * (0.6 + r() * 0.8);
    }
    return out;
  }
  function elephant(x, base, s) {
    return '<use href="#ele" transform="translate(' + x + ' ' + (base - 76 * s).toFixed(1) + ') scale(' + s + ')"/>';
  }
  $("far").innerHTML =
    spears(800, 380, { seed: 7, min: 40, max: 120, gap: 15, sw: 2, flag: 16 }) +
    elephant(610, 380, 0.8) + elephant(700, 380, 0.62);
  $("bgSvg").innerHTML =
    '<g style="fill:var(--bronze);stroke:var(--bronze)" stroke-linecap="round" opacity="0.16">' +
    spears(1200, 300, { seed: 21, min: 50, max: 190, gap: 20, sw: 2.2, flag: 20 }) +
    elephant(170, 300, 1.15) + elephant(600, 300, 1.35) + elephant(980, 300, 1.1) +
    '<rect x="0" y="296" width="1200" height="4" stroke="none"/></g>';

  /* ---------- screens ---------- */
  var screens = { title: $("screen-title"), quiz: $("screen-quiz"), result: $("screen-result") };
  function go(name) {
    for (var k in screens) screens[k].hidden = (k !== name);
    document.getElementById("root").setAttribute("data-screen", name);
    window.scrollTo(0, 0);
  }

  /* ---------- quiz ---------- */
  function segs(final) {
    return Q.map(function (q, k) {
      var a = state.answers[k], c = "";
      if (a) c = a.status; else if (!final && k === state.i) c = "now";
      return '<li class="' + c + '"></li>';
    }).join("");
  }

  function showQuestion() {
    var q = Q[state.i];
    state.locked = false;
    $("qnum").textContent = "Question " + (state.i + 1) + " of " + Q.length;
    $("score").textContent = state.score;
    $("qtext").textContent = q.q;
    $("opts").innerHTML = q.o.map(function (t, k) {
      return '<li><button type="button" class="opt" data-k="' + k + '">' +
        '<span class="key">' + LETTERS[k] + '</span><span class="txt">' + t + '</span><span class="mark" aria-hidden="true"></span></button></li>';
    }).join("");
    $("fb").innerHTML = "";
    $("next").hidden = true;
    $("segs").innerHTML = segs(false);
    $("qtext").focus({ preventScroll: true });
  }

  function choose(k) {
    if (state.locked) return;
    state.locked = true;
    var q = Q[state.i], status, label;
    if (q.unscored) { status = "neutral"; label = "Not scored"; }
    else if (k === q.a) { status = "correct"; label = "Correct"; state.score++; }
    else { status = "wrong"; label = "Not quite"; }
    state.answers[state.i] = { choice: k, status: status };

    var btns = $("opts").querySelectorAll(".opt");
    btns.forEach(function (b, idx) {
      b.setAttribute("aria-disabled", "true");
      if (q.unscored) {
        if (idx === k) b.classList.add("picked"); else b.classList.add("dim");
      } else if (idx === q.a) {
        b.classList.add("correct");
      } else if (idx === k) {
        b.classList.add("wrong");
      } else {
        b.classList.add("dim");
      }
    });

    var body = q.e;
    if (status === "wrong") body = "The answer is " + LETTERS[q.a] + ") " + q.o[q.a] + ". " + q.e;
    $("fb").innerHTML = '<p class="status ' + status + '">' + label + '</p><p>' + body + '</p><p class="ref">' + q.ref + '</p>';
    $("score").textContent = state.score;
    $("segs").innerHTML = segs(false);

    var last = state.i === Q.length - 1;
    $("next").textContent = last ? "See result" : "Next question";
    $("next").hidden = false;
    $("next").focus({ preventScroll: true });
    $("next").scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function next() {
    state.i++;
    if (state.i < Q.length) showQuestion(); else showResult();
  }

  function start() {
    state = { i: 0, score: 0, answers: [], locked: false };
    go("quiz");
    showQuestion();
  }

  /* ---------- result ---------- */
  function showResult() {
    var s = state.score, pct = s / SCORED, title, msg;
    if (s === SCORED) { title = "Full marks"; msg = "You know this field well. Every answer was right."; }
    else if (s >= 7) { title = "Well done"; msg = "Your knowledge of the Gita stands firm. A few verses are worth another look."; }
    else if (s >= 5) { title = "A steady start"; msg = "You have the shape of it. Read the explanations below and try again."; }
    else { title = "The battle has begun"; msg = "Arjuna began with questions too. Review the answers and take another turn."; }

    $("rtitle").textContent = title;
    $("rmsg").textContent = msg;
    $("rnote").textContent = "";
    $("ringScore").textContent = s;
    $("ringOf").textContent = "of " + SCORED;
    $("ring").setAttribute("aria-label", "You scored " + s + " out of " + SCORED);
    $("rsegs").innerHTML = segs(true);

    $("rlist").innerHTML = Q.map(function (q, k) {
      var a = state.answers[k];
      var mine = q.o[a.choice];
      var line;
      if (a.status === "correct") line = '<span class="ok">Correct.</span> You chose ' + LETTERS[a.choice] + ') ' + mine + '.';
      else if (a.status === "wrong") line = '<span class="no">Missed.</span> You chose ' + LETTERS[a.choice] + ') ' + mine + '. Answer: ' + LETTERS[q.a] + ') ' + q.o[q.a] + '.';
      else line = 'You chose ' + LETTERS[a.choice] + ') ' + mine + '. Not scored.';
      return '<li><p class="rq">' + q.q + '</p><p class="ra">' + line + '</p></li>';
    }).join("");
    document.querySelector(".review").open = false;

    var arc = $("arc"), C = 414.69;
    arc.style.strokeDashoffset = C;
    go("result");
    $("rtitle").focus({ preventScroll: true });
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { arc.style.strokeDashoffset = (C * (1 - pct)).toFixed(2); });
    });
  }

  /* ---------- events ---------- */
  $("start").addEventListener("click", start);
  $("again").addEventListener("click", start);
  $("next").addEventListener("click", next);
  $("opts").addEventListener("click", function (e) {
    var b = e.target.closest(".opt");
    if (b) choose(+b.getAttribute("data-k"));
  });
  document.addEventListener("keydown", function (e) {
    if (screens.quiz.hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = LETTERS.indexOf(e.key.toLowerCase());
    if (k < 0 && /^[1-4]$/.test(e.key)) k = +e.key - 1;
    if (k >= 0 && k < Q[state.i].o.length && !state.locked) { choose(k); }
  });
})();
</script>

</body></html>
