<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2 {
            text-align: center;
        }

        .photo {
            width: 20%;
        }

        .photo img {
            width: 100%;
            background-color: lightgray;
            border-radius: 5px;
        }

        .photo img:hover {
            transform: scale(1.05);
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.7);
        }

        .gallery {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;

        }

        @media (max-width:700px) {
            .photo {
                width: 40%;
            }
        }

        @media (max-width:400px) {
            .photo {
                width: 80%;
            }
        }
    </style>
</head>

<body>
    <h2>Photo Gallery</h2>
    <div class="gallery">
        
        <div class="photo">
            <img src="https://media.tenor.com/1eZJF7qDOIQAAAA1/beatboxing-cat-cat.webp" alt="Photo 1">
        </div>
        
        <div class="photo">
            <img src="https://media.tenor.com/gxQYI5_n0oYAAAA1/cool-cat.webp" alt="Photo 2">
        </div>
        
        <div class="photo">
            <img src="https://media.tenor.com/UEaf09wDq5YAAAA1/p111gmej-vibe-cat.webp" alt="Photo 3">
        </div>
        
        <div class="photo">
            <img src="https://media.tenor.com/PfiuP87QTQUAAAAM/cat-orange-cat.gif" alt="Photo 4">
        </div>
        
        <div class="photo">
            <img src="https://media.tenor.com/bn9jt1wH3jwAAAAM/bored-boredom.gif" alt="Photo 5">
        </div>
        
        <div class="photo">
            <img src="https://media.tenor.com/GJUz8DogSTUAAAAm/cute-cat-cutie.webp" alt="Photo 6">
        </div>
        
        <div class="photo">
            <img src="https://media.tenor.com/2iNYnGeZ4_IAAAAM/uncanny-cat-uncanny.gif" alt="Photo 7">
        </div>
        
        <div class="photo">
            <img src="https://media.tenor.com/-vqv0qnOtxsAAAA1/weird-stare.webp" alt="Photo 8">
        </div>
    
    </div>
</body>

</html>
