<!DOCTYPE html>
<html>
<head>
    <title>Header and Navbar - MyStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex flex-col min-h-screen">

    <!-- Header -->
    <!-- MODIFICATION: Header background changed from blue/gray to bg-indigo-600 -->
    <header class="bg-slate-600 text-white p-4">

        <div class="flex justify-between items-center max-w-7xl mx-auto">

            <!-- Logo -->
            <h1 class="text-2xl font-bold">MyStore</h1>

            <!-- Navigation -->
            <nav class="flex gap-6">

                    <div class="hidden group-hover:block absolute bg-white text-black p-2 w-32 shadow-md z-10">

                        <a href="#" class="block p-2 hover:bg-gray-200">
                            Laptop
                        </a>

                        <a href="#" class="block p-2 hover:bg-gray-200">
                            Mobile
                        </a>

                        <a href="#" class="block p-2 hover:bg-gray-200">
                            Shoes
                        </a>

                        <!-- MODIFICATION: Added Watch option in dropdown -->
                        <a href="#" class="block p-2 hover:bg-gray-200">
                            Watch
                        </a>

                    </div>
                </div>


            </nav>

        </div>

    </header>

    <!-- Main Content Section -->
    <main class="flex-grow p-8">
        <h2 class="text-2xl font-semibold text-center mb-8 text-gray-800">Our Products</h2>

        <!-- Products Grid Container -->
        <div class="flex flex-wrap justify-center gap-6 max-w-6xl mx-auto">

            <!-- 1. Laptop Card -->
            <div class="bg-white p-4 rounded-md shadow-sm border w-[230px] flex flex-col justify-between">
                <div>
                    <!-- MODIFICATION: Added 200x120 Laptop Image -->
                    <img src="https://images.unsplash.com/photo-1603302576837-37561b2e2302?w=200&h=120&fit=crop" 
                         alt="Laptop" 
                         width="200" 
                         height="120" 
                         class="w-[200px] h-[120px] object-cover mx-auto mb-3 rounded" />
                    <h3 class="text-lg font-bold text-gray-800">Laptop</h3>
                    <p class="text-gray-600 mb-4">Price: ₹45,999</p>
                </div>
                <!-- MODIFICATION: Button color changed from blue to bg-indigo-600 -->
                <button class="bg-cyan-600 hover:bg-indigo-700 text-white py-2 px-4 rounded w-full transition">
                    Buy Now
                </button>
            </div>

            <!-- 2. Mobile Card -->
            <div class="bg-white p-4 rounded-md shadow-sm border w-[230px] flex flex-col justify-between">
                <div>
                    <!-- MODIFICATION: Added 200x120 Mobile Image -->
                    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=200&h=120&fit=crop" 
                         alt="Mobile" 
                         width="200" 
                         height="120" 
                         class="w-[200px] h-[120px] object-cover mx-auto mb-3 rounded" />
                    <h3 class="text-lg font-bold text-gray-800">Mobile</h3>
                    <p class="text-gray-600 mb-4">Price: ₹19,999</p>
                </div>
                <!-- MODIFICATION: Button color changed from blue to bg-indigo-600 -->
                <button class="bg-cyan-600 hover:bg-indigo-700 text-white py-2 px-4 rounded w-full transition">
                    Buy Now
                </button>
            </div>

            <!-- 3. Shoes Card -->
            <div class="bg-white p-4 rounded-md shadow-sm border w-[230px] flex flex-col justify-between">
                <div>
                    <!-- MODIFICATION: Added 200x120 Shoes Image -->
                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=200&h=120&fit=crop" 
                         alt="Shoes" 
                         width="200" 
                         height="120" 
                         class="w-[200px] h-[120px] object-cover mx-auto mb-3 rounded" />
                    <h3 class="text-lg font-bold text-gray-800">Shoes</h3>
                    <p class="text-gray-600 mb-4">Price: ₹2,499</p>
                </div>
                <!-- MODIFICATION: Button color changed from blue to bg-indigo-600 -->
                <button class="bg-cyan-600 hover:bg-indigo-700 text-white py-2 px-4 rounded w-full transition">
                    Buy Now
                </button>
            </div>

            <!-- 4. Watch Card -->
            <div class="bg-white p-4 rounded-md shadow-sm border w-[230px] flex flex-col justify-between">
                <div>
                    <!-- MODIFICATION: Added 200x120 Watch Image -->
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=200&h=120&fit=crop" 
                         alt="Watch" 
                         width="200" 
                         height="120" 
                         class="w-[200px] h-[120px] object-cover mx-auto mb-3 rounded" />
                    <h3 class="text-lg font-bold text-gray-800">Watch</h3>
                    <p class="text-gray-600 mb-4">Price: ₹3,499</p>
                </div>
                <!-- MODIFICATION: Button color changed from blue to bg-indigo-600 -->
                <button class="bg-cyan-600 hover:bg-indigo-700 text-white py-2 px-4 rounded w-full transition">
                    Buy Now
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 text-white text-center p-4">
        <p>MyStore &copy; 2026</p>
    </footer>

</body>
</html>
